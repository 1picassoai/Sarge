name: verify release

# The gate behind two promises that had none. Both installers pin a sha256 for every asset
# they download and a TAG they clone; nothing enforced that those values match what is
# actually published. @Galahad's review of v0.2.0 (21 Sep) named it the third self-
# referential trap in the installer: ORGAN_SHA256 is welded to one build, and a rebuild
# without an installer change would kill every install. The tag pin is the older one - it
# blocked v0.1.1-rc1 when the installer said v0.1.0 while the script came from main.
#
# So this job, for a given release tag:
#   1. checks out the installers AT THAT TAG and reads every pinned value out of them
#   2. requires both installers to pin THIS tag
#   3. downloads each asset ANONYMOUSLY from the public release URL - the stranger path,
#      no token, no artifact shortcut - and hashes it
#   4. fails on any missing asset, any hash mismatch, or a model hash the two installers
#      disagree on
#
# Proven red before it was trusted, and precisely which branch:
#   - the TAG gate went red on v0.1.1 (run 35591775978): install.sh does not exist at that
#     tag, so the installer there could never pin it. A real defect on a shipped tag.
#   - the HASH-MISMATCH branch has not gone red in CI, because no published tag carries a
#     wrong pin and a throwaway public tag with bad hashes would be a live trap. It was
#     executed red OFF-REPO on 21 Sep: the same check() below, the real v0.2.0 asset from
#     the public URL, a deliberately zeroed pin -> "FAIL ... published d0fdf88e..., installer
#     pins 0000..." and exit 1; the control with the right pin -> ok. Output is in
#     CompilerGPT/docs/MAC-RELEASE-BRIEF.md.
#   - the whole job went green on v0.2.0 (run 35591781509).
# If you change check(), re-run that off-repo proof. A gate that reads as proven and is not
# is the failure mode this file exists to close.

on:
  release:
    types: [published, edited]
  workflow_dispatch:
    inputs:
      tag:
        description: "release tag to verify, e.g. v0.2.0"
        required: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TAG: ${{ inputs.tag || github.event.release.tag_name }}
      REPO: https://github.com/1picassoai/Sarge

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.event.release.tag_name }}

      - name: read what the installers pin
        id: pins
        run: |
          set -euo pipefail
          # The tag pattern allows a SUFFIX. v0.3.0-rc1 failed this gate on 23 Sep because
          # the pattern stopped at the dash, so it read an EMPTY tag, compared "" against
          # the release, and blocked a release candidate for being a release candidate.
          # The gate was right in spirit and out of date in fact - the same class as the
          # stale binary that morning: a mechanism that no longer matched what it guards.
          #
          # Windows came out the same day on the Captain's ruling, so install.ps1, the
          # CUDA runtime and the Windows organ are no longer read or checked here.
          pin() { grep -oE "$2" "$1" | head -1 | grep -oE '[0-9a-f]{64}|v[0-9]+[.][0-9]+[.][0-9]+(-[0-9A-Za-z.]+)?' || true; }
          SH_TAG=$(pin install.sh     '^TAG="v[0-9A-Za-z.-]+"')
          MAC_ORGAN=$(pin install.sh  '^ORGAN_SHA256="[0-9a-f]{64}"')
          SH_MODEL=$(pin install.sh   '^MODEL_SHA256="[0-9a-f]{64}"')
          printf '%-12s %s\n' "release tag" "$TAG" "sh tag" "${SH_TAG:-MISSING}" \
            "mac organ" "${MAC_ORGAN:-MISSING}" "sh model" "${SH_MODEL:-MISSING}"
          for v in SH_TAG MAC_ORGAN SH_MODEL; do
            echo "$v=${!v}" >> "$GITHUB_OUTPUT"
          done

      - name: the installer pins the tag it ships in
        run: |
          set -euo pipefail
          [ "${{ steps.pins.outputs.SH_TAG }}" = "$TAG" ] \
            || { echo "install.sh pins '${{ steps.pins.outputs.SH_TAG }}', release is '$TAG'"; \
                 echo "AN INSTALLER AT THIS TAG WOULD CLONE A DIFFERENT TAG - the v0.1.1-rc1 blocker, again"; \
                 exit 1; }
          echo "install.sh pins $TAG"

      # Anonymous. No token, no artifact. If this differs from what a stranger gets, it is
      # not a test of what a stranger gets.
      - name: download every asset anonymously and hash it
        run: |
          set -euo pipefail
          check() {
            name="$1"; want="$2"
            [ -n "$want" ] || { echo "FAIL  $name: no hash pinned in the installer"; return 1; }
            url="$REPO/releases/download/$TAG/$name"
            if ! curl -fsSL "$url" -o "$name"; then
              echo "FAIL  $name: not on release $TAG ($url)"; return 1
            fi
            got=$(sha256sum "$name" | awk '{print $1}')
            size=$(stat -c %s "$name")
            if [ "$got" != "$want" ]; then
              echo "FAIL  $name: published $got, installer pins $want ($size bytes)"; return 1
            fi
            echo "ok    $name  $size bytes  $got"
          }
          fail=0
          check sarge-organ-macos-arm64.zip    "${{ steps.pins.outputs.MAC_ORGAN }}" || fail=1
          [ "$fail" = 0 ] || { echo; echo "AN INSTALLER AT $TAG WOULD DELETE A DOWNLOAD AND STOP - every install would fail"; exit 1; }
          echo; echo "every asset on $TAG matches what the installers pin"

      # Hugging Face publishes the model's sha256 as X-Linked-ETag. A HEAD is enough - no need
      # to pull 2.4 GB to know whether the installers pin the right number.
      - name: the model hash matches what Hugging Face publishes
        run: |
          set -euo pipefail
          url="https://huggingface.co/unsloth/Qwen3-4B-Instruct-2507-GGUF/resolve/main/Qwen3-4B-Instruct-2507-Q4_K_M.gguf"
          etag=$(curl -sIL "$url" | grep -i '^x-linked-etag:' | tail -1 | grep -oE '[0-9a-f]{64}' || true)
          [ -n "$etag" ] || { echo "could not read X-Linked-ETag from Hugging Face - cannot verify the model pin"; exit 1; }
          [ "$etag" = "${{ steps.pins.outputs.SH_MODEL }}" ] \
            || { echo "FAIL  model: Hugging Face publishes $etag, installers pin ${{ steps.pins.outputs.SH_MODEL }}"; exit 1; }
          echo "ok    model  $etag"
